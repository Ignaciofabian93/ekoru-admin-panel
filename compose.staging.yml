name: "ekoru-admin-panel-staging"

services:
  ekoru-admin-panel:
    image: ekoru-admin-panel-staging
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined at build time, so the target environment must
      # be passed as a build arg (not just via env_file, which is runtime only).
      args:
        NEXT_PUBLIC_ENVIRONMENT: staging
    restart: always
    # docker stop: a small init passes SIGTERM to the app, which finishes its
    # requests and jobs in progress. Docker kills it only after 30 seconds.
    init: true
    stop_grace_period: 30s
    container_name: ekoru-admin-panel-staging
    env_file:
      - .env.staging
    environment:
      # INF-23: reach the gateway on the docker network, not through Cloudflare.
      # Without it the app falls back to https://staging-api.ekoru.cl.
      GATEWAY_INTERNAL_URL: http://ekoru-gateway-staging:4000
    ports:
      - "127.0.0.1:9001:3000"
    networks:
      # The staging gateway's network; its name doesn't resolve on ekoru-network.
      - ekoru-staging-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 30s

networks:
  ekoru-staging-network:
    external: true
